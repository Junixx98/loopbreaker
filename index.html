<title>LoopBreaker 2.0</title>
<style>
:root{
  --bg:#0c0e13; --card:#151823; --card2:#1d2230; --card3:#242a3b;
  --text:#e9ecf4; --muted:#8b91a5; --line:#242a38;
  --accent:#4ade80; --accent2:#38bdf8; --danger:#f87171; --warn:#fbbf24;
}
body.light{
  --bg:#f2f4f8; --card:#ffffff; --card2:#eef1f6; --card3:#e3e8f0;
  --text:#171b25; --muted:#66707f; --line:#dfe4ec;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));display:flex;align-items:center;gap:14px}
header h1{font-size:17px;letter-spacing:.5px}
header h1 span{color:var(--accent)}
#hdrClock{margin-left:auto;text-align:right;line-height:1.15}
#hdrTime{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
#hdrDate{font-size:11px;color:var(--muted)}
main{max-width:780px;margin:0 auto;padding:16px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.wcard.sz-s{padding:10px 12px;font-size:.9em}
.wcard.sz-l{padding:20px;font-size:1.1em}
.whead{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.whead h2{font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard.sz-s .whead h2{font-size:12px}
.wctl{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:7px;font-size:10px;padding:3px 7px;cursor:pointer;font-weight:700}
.wcard{position:relative}
.wcorner{position:absolute;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:16px;font-weight:800;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:6;padding:0;line-height:1}
.wcard.editing .wcorner{display:flex}
.wc-tl{top:-8px;left:-8px;color:#f87171;border-color:#f8717155;background:#241416}
.wc-tr{top:-8px;right:-8px;color:var(--accent);border-color:var(--accent);cursor:grab;touch-action:none}
.wc-bl{bottom:-8px;left:-8px}
.wc-br{bottom:-8px;right:-8px;color:var(--accent);border-color:var(--accent)}
.wcard.dragging{opacity:.55;outline:2px dashed var(--accent);outline-offset:3px}
.wctl:hover{color:var(--text)}
.muted{color:var(--muted);font-size:13px}
.big{font-size:28px;font-weight:800}
.btn{background:var(--accent);color:#08130c;border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#1a0505}
.btn.small{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:active{transform:scale(.97)}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font-size:14px;width:100%;font-family:inherit}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:8px;margin-top:8px}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stat .v{font-size:16px;font-weight:700}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:14px;color:transparent;user-select:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:#08130c}
.streak{font-size:11px;color:var(--warn);white-space:nowrap}
.x{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;flex:none}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar i.over{background:var(--danger)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--muted);padding:9px 2px 10px;font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
/* notes editor */
.noteEd{position:fixed;inset:0;background:var(--bg);z-index:150;display:none;flex-direction:column}
.noteEd.on{display:flex}
.neTop{display:flex;gap:8px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));align-items:center;border-bottom:1px solid var(--line)}
.neTitle{background:none;border:none;color:var(--text);font-size:25px;font-weight:300;padding:14px 16px 4px;font-family:inherit}
.neTitle:focus{outline:none}
.neMeta{color:var(--muted);font-size:12px;padding:0 16px 12px}
.neBody{flex:1;overflow-y:auto;padding:6px 16px 16px;font-size:16px;line-height:1.7;border:none!important;border-radius:0!important;background:none!important;min-height:0;color:var(--text)}
.neBody:focus{outline:none}
.neBar{display:flex;gap:6px;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);overflow-x:auto;background:var(--card)}
.neBar .tbtn{flex:none;font-size:15px;padding:9px 12px;margin:0}
.nePanel{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom));display:none;position:relative}
.nePanel.on{display:block}
.nePanel .xclose{position:absolute;top:8px;right:12px}
.neSizes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.neSizes button{min-width:44px}
.neColors{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.neSw{width:36px;height:27px;border-radius:7px;border:1px solid var(--line);cursor:pointer;padding:0}
.neSw.sel{border:2px solid var(--text)}
.neSizes button.sel{border-color:var(--accent);color:var(--accent)}
.ntask{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.ntask input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.nprev{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.protobanner{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.45);color:#fca5a5;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;margin:12px 16px 0;max-width:780px}
.protobanner code{background:var(--card3);padding:2px 7px;border-radius:6px;font-size:11px;color:var(--accent2);user-select:all}
.ncard{transition:transform .12s}
#integrityMark{position:fixed;right:10px;bottom:72px;font-size:9px;color:var(--muted);opacity:.55;z-index:70;pointer-events:none}
#errorBox{position:fixed;left:12px;right:12px;bottom:96px;z-index:999;background:#2b0d0d;border:1px solid #f87171;color:#fca5a5;padding:14px;border-radius:12px;font-size:12px;line-height:1.6;display:none}
#errorBox code{color:#fbbf24;user-select:all}
.ncard:active{transform:scale(.98)}

nav button .ic{font-size:19px}
nav button.on{color:var(--accent)}
.tab{display:none}
.tab.on{display:block}
.badge{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:11px;margin:2px 3px 2px 0}
.banner{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:var(--warn);border-radius:12px;padding:12px;font-size:13px;margin-bottom:14px}
.idline{font-size:15px;font-style:italic;color:var(--accent);margin-bottom:4px;cursor:pointer}
.pos{color:var(--accent)}
.neg{color:var(--danger)}
.timer-big{font-size:52px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px}
.center{text-align:center}
.pill{font-size:11px;border-radius:99px;padding:2px 9px;font-weight:700;flex:none}
.pill.W{background:rgba(74,222,128,.15);color:#4ade80}
.pill.L{background:rgba(248,113,113,.15);color:#f87171}
.pill.BE{background:var(--card2);color:var(--muted)}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:14px 0 6px}
label.fl{font-size:11px;color:var(--muted);display:block;margin:8px 0 3px}
.trade-card{background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px}
.trade-card .top{display:flex;align-items:center;gap:8px}
.trade-card .sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
/* chips & calendar */
.chip{display:block;font-size:10px;border-radius:5px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#0b0d12;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal .day{min-height:64px;background:var(--card2);border-radius:9px;padding:3px 4px;font-size:12px;cursor:pointer;position:relative;border:1px solid transparent;overflow:hidden}
.cal .day.empty{background:transparent;border:none;cursor:default}
.cal .day.today{border-color:var(--accent)}
.cal .day.holi{background:rgba(239,68,68,.08)}
.cal .day .num{font-weight:700}
.h1{box-shadow:inset 0 -3px 0 rgba(74,222,128,.35)}
.h2{box-shadow:inset 0 -3px 0 rgba(74,222,128,.55)}
.h3{box-shadow:inset 0 -3px 0 rgba(74,222,128,.75)}
.h4{box-shadow:inset 0 -3px 0 #4ade80}
.wkwrap{overflow-x:auto}
.week{display:grid;grid-template-columns:44px repeat(7,1fr);min-width:640px}
.week .wh{font-size:10px;color:var(--muted);text-align:center;padding:4px 2px;border-bottom:1px solid var(--line)}
.week .wcol{border-left:1px solid var(--line);position:relative;height:540px}
.week .wcol .hline{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.5}
.week .wev{position:absolute;left:2px;right:2px;border-radius:6px;font-size:10px;padding:2px 4px;color:#0b0d12;font-weight:600;overflow:hidden;cursor:pointer}
.week .wtime{font-size:9px;color:var(--muted);position:relative}
.week .wtime span{position:absolute;top:-6px;left:2px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:86vh;overflow-y:auto;padding:16px}
.modal h3{margin-bottom:10px;font-size:16px}
/* trading pnl calendar */
.pnl{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.pnl .dow{text-align:center;font-size:10px;color:var(--muted);padding:3px 0}
.pnl .cell{min-height:52px;background:var(--card2);border-radius:8px;padding:4px;font-size:11px}
.pnl .cell.empty{background:transparent}
.pnl .cell .pn{font-weight:700;font-size:10px;margin-top:2px}
.pnl .cell.win{background:rgba(74,222,128,.13)}
.pnl .cell.loss{background:rgba(248,113,113,.13)}
.pnl .tcell{background:var(--card3);border-radius:8px;padding:4px;font-size:10px;font-weight:700;display:flex;flex-direction:column;justify-content:center}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:11px}
.sess{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.livebadge{font-size:10px;background:rgba(74,222,128,.15);color:#4ade80;border-radius:99px;padding:2px 8px;font-weight:800}
.offbadge{font-size:10px;background:var(--card2);color:var(--muted);border-radius:99px;padding:2px 8px}
.mbars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.mbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.mbar i{display:block;width:70%;border-radius:4px 4px 0 0;min-height:2px}
.mbar span{font-size:9px;color:var(--muted);margin-top:3px}
.ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ycell{background:var(--card2);border-radius:8px;padding:8px;text-align:center}
.ycell .ym{font-size:10px;color:var(--muted)}
.ycell .yv{font-size:13px;font-weight:800;margin-top:2px}
.legend{font-size:11px;margin-top:8px}
.legend span{margin-right:10px;white-space:nowrap}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:2px}
.pcsmall{font-size:11px;color:var(--muted)}
/* v2.1 additions */
.tbtn{background:var(--card3);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 11px;font-size:13px;cursor:pointer;margin:0 4px 4px 0}
.tbtn:hover{border-color:var(--accent)}
.editing .wcard{resize:both;overflow:auto;min-width:180px;min-height:120px}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;margin:3px 4px 0 0}
[contenteditable]{outline:none;border:1px dashed var(--line);border-radius:10px;padding:10px;min-height:100px;font-size:14px;line-height:1.6}
[contenteditable]:focus{border-color:var(--accent)}
.miniwrap{display:flex;gap:5px;align-items:flex-end;height:58px;margin-top:10px}
.mini{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.mini i{width:70%;border-radius:4px 4px 0 0;display:block;min-height:2px}
.mini span{font-size:9px;color:var(--muted);margin-top:2px}
.impchip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;margin:2px 4px 2px 0}
/* interactivity 2.2 */
:root{color-scheme:dark}
body.light{color-scheme:light}
#uiToast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);background:var(--card3);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88vw;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#uiToast.show{opacity:1;transform:translate(-50%,0)}
.pickbtn{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font-size:14px;width:100%;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:inherit;transition:transform .1s,border-color .15s}
.pickbtn:active{transform:scale(.97);border-color:var(--accent)}
.pickopt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:13px 14px;font-size:15px;margin-bottom:8px;cursor:pointer;font-family:inherit;transition:transform .1s,border-color .15s}
.pickopt:active{transform:scale(.97);border-color:var(--accent)}
.tab.on{animation:tabIn .22s ease}
@keyframes tabIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.modal-bg.on .modal{animation:sheetUp .24s ease}
@keyframes sheetUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.chk{transition:transform .12s}
.chk.on{animation:popIn .18s ease}
@keyframes popIn{0%{transform:scale(.55)}70%{transform:scale(1.14)}100%{transform:scale(1)}}
.wctl:active,.tbtn:active{transform:scale(.94)}
.cal .day{transition:transform .1s}
.cal .day:active{transform:scale(.94)}
.thumb{transition:transform .15s}
.thumb:active{transform:scale(.93)}
.bar i{transition:width .45s ease}
nav button{transition:color .18s,transform .12s}
nav button:active{transform:scale(.92)}
/* session clock map */
.scutc{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}

<style id="lbSplashCss">
#lbSplash{position:fixed;left:0;right:0;top:0;bottom:0;z-index:99999;background:#0c0e13;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:lbSA .45s ease 7s forwards}
#lbSplash .lbGlow{position:absolute;left:0;right:0;top:0;bottom:0;background:radial-gradient(circle at 50% 34%,rgba(34,197,94,.17),transparent 62%)}
#lbSplash .lbOrbit{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(34,197,94,.10);animation:lbPulse 3.6s ease-in-out infinite alternate}
#lbSplash .lbO1{width:300px;height:300px}
#lbSplash .lbO2{width:440px;height:440px;border-color:rgba(34,197,94,.06)}
#lbSplash .lblogo{position:relative;animation:lbZoom .6s cubic-bezier(.2,.9,.25,1.15) .05s backwards}
#lbSplash .lbname{position:relative;margin-top:14px;font-size:27px;font-weight:800;letter-spacing:.04em;color:#e2e8f0;animation:lbUp .55s ease .3s backwards}
#lbSplash .lbname span{color:#22c55e}
#lbSplash .lbtag{position:relative;margin-top:5px;font-size:13px;color:#94a3b8;animation:lbUp .55s ease .42s backwards}
#lbSplash .lbq{position:relative;margin:32px 26px 0;max-width:640px;text-align:center;font-style:italic;font-size:20px;line-height:1.5;color:#e2e8f0;animation:lbUp .6s ease .58s backwards}
#lbSplash .lbq .lbqmark{color:#22c55e;font-size:24px;margin-right:7px;opacity:.85}
#lbSplash .lbday{position:relative;margin-top:20px;font-size:12px;letter-spacing:.10em;text-transform:uppercase;color:#64748b;animation:lbUp .5s ease 1.2s backwards}
#lbSplash .lbtrack{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);width:240px;max-width:62vw;height:3px;border-radius:2px;background:rgba(148,163,184,.16);overflow:hidden;animation:lbUp .6s ease 1s backwards}
#lbSplash .lbbar{height:100%;width:0;background:#22c55e;border-radius:2px;transition:width .45s ease}
#lbSplash .lbver{position:absolute;bottom:36px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.14em;color:#475569;animation:lbUp .6s ease 1.1s backwards}
#lbSplash.done{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s linear;animation:none}
#lbSplash.done *{animation:none}
@keyframes lbUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes lbPulse{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.045)}}
@keyframes lbZoom{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes lbSA{to{opacity:0;visibility:hidden}}

// ================= ERROR SELF-DIAGNOSIS =================
function showFatal(m){
  let d=document.getElementById('errorBox');
  if(!d){ d=document.createElement('div'); d.id='errorBox'; document.body.appendChild(d); }
  d.style.display='block';
  d.innerHTML='⚠️ <b>App error</b> — screenshot this and send it to me:<br><code>'+String(m)+'</code><br><br>Tip: the file may have downloaded incompletely. Re-download it fully and try again. <button class="btn ghost small" style="margin-left:6px" onclick="this.parentElement.style.display=\'none\'">hide</button>';
}
window.onerror=function(msg,src,line){ showFatal(msg+(line?(' · line '+line):'')); return false; };
// ================= STATE =================

const ACCENTS={green:'#4ade80',blue:'#38bdf8',purple:'#a78bfa',orange:'#fb923c'};
const CATS={personal:['#38bdf8','Personal'],school:['#a78bfa','School'],work:['#fb923c','Work'],trading:['#4ade80','Trading'],money:['#fbbf24','Money'],news:['#f87171','News']};
const def={
  identity:'I am becoming a disciplined forex trader.',
  checklist:{morning:[],afternoon:[],night:[]},
  done:{}, notes:{},
  expenses:[], income:[], budgets:{}, goals:{target:0,saved:0},
  sleep:[], sleepDraft:{bed:null,wake:null}, countdown:null, pomo:{},
  trades:[], openTrades:[], startBal:50000,
  playbook:[], mistakes:[],
  preChkItems:[
    {id:'pc1',text:'Matches my plan / setup'},
    {id:'pc2',text:'Risk ≤ 1–2%, stop loss set'},
    {id:'pc3',text:'Not revenge / FOMO / boredom'},
    {id:'pc4',text:'Checked news / session times'}
  ],
  events2:[], accent:'green',
  impacts:[{id:'hi',emoji:'🔴',label:'High'},{id:'md',emoji:'🟡',label:'Medium'},{id:'lo',emoji:'⚪',label:'Low'}],
  notesBoard:[], extraCats:[], hiddenCats:[], timer:{work:25,break:5},
  lastBackup:0, dark:true, widgets:{}, editMode:false
};
let S={};
function load(){
  try{ const r=localStorage.getItem(KEY); S=r?Object.assign(JSON.parse(JSON.stringify(def)),JSON.parse(r)):JSON.parse(JSON.stringify(def)); }
  catch(e){ S=JSON.parse(JSON.stringify(def)); }
  migrate();
}
function migrate(){
  if(S.events && typeof S.events==='object' && !Array.isArray(S.events)){
    Object.keys(S.events).forEach(function(d){ (S.events[d]||[]).forEach(function(e){
      S.events2.push({id:e.id,date:d,title:e.title,cat:'personal',recur:e.recur||null,start:'',end:'',impact:''});
    }); });
    delete S.events;
  }
  if(!Array.isArray(S.events2))S.events2=[];
  if(!Array.isArray(S.income))S.income=[];
  if(!S.preChkItems||!S.preChkItems.length)S.preChkItems=JSON.parse(JSON.stringify(def.preChkItems));
  if(!S.openTrades)S.openTrades=[];
  if(!S.budgets)S.budgets={};
  if(S.countdown){ (S.countdowns=S.countdowns||[]).push({id:(S.countdown.id||uid()),title:(S.countdown.title||'Big day'),date:(S.countdown.date||todayStr())}); S.countdown=null; }
  if(!Array.isArray(S.countdowns))S.countdowns=[];
  if(!Array.isArray(S.customCats))S.customCats=[];
  if(!Array.isArray(S.extraInc))S.extraInc=[];
  if(!Array.isArray(S.checkSections)||!S.checkSections.length)S.checkSections=[{key:'morning',name:'🌅 Morning'},{key:'afternoon',name:'☀️ Afternoon'},{key:'night',name:'🌙 Night'}];
  S.checkSections.forEach(function(g){ if(g&&g.key&&!S.checklist[g.key])S.checklist[g.key]=[]; });
  if(!Array.isArray(S.hiddenCats))S.hiddenCats=[];
  if(!Array.isArray(S.hiddenInc))S.hiddenInc=[];
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ if(!window._saveWarned){ window._saveWarned=true; setTimeout(function(){ try{ uiToast('⚠️ This window cannot save — data resets on reload. Open the installed/deployed app to keep everything.'); }catch(_){}; },400); } } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function todayStr(d){ d=d||new Date(); const p=function(n){return String(n).padStart(2,'0');}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function fmtPeso(n){ return '₱'+Number(n).toLocaleString('en-PH',{maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function addDays(str,n){ const d=new Date(str+'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
function stat(v,l){ return '<div class="stat"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }
function applyTheme(){
  document.body.className=(S.dark?'dark':'light')+(S.editMode?' editing':'');
  document.documentElement.style.setProperty('--accent',ACCENTS[S.accent]||ACCENTS.green);
  document.getElementById('btnTheme').innerHTML=ic(S.dark?'sun':'moon',16);
}

function ic(name,s){ s=s||17; return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px">'+(ICONS[name]||'')+'</svg>'; }

function tickClock(){
  const n=new Date();
  const p=function(x){return String(x).padStart(2,'0');};
  document.getElementById('hdrTime').textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
  document.getElementById('hdrDate').textContent=n.toLocaleDateString('en',{weekday:'long',month:'short',day:'numeric',year:'numeric'});
  tickSessions();
  tickSleepBoxes();
}
function tickSleepBoxes(){
  const bb=document.getElementById('sleepBedBox'); if(!bb)return;
  const n=new Date();
  const p=function(x){return String(x).padStart(2,'0');};
  const now=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
  const wb=document.getElementById('sleepWakeBox');
  const bs=document.getElementById('sleepBedState'), ws=document.getElementById('sleepWakeState');
  const d=S.sleepDraft||{bed:null,wake:null};
  if(d.bed){ bb.textContent=d.bed; bb.style.color='var(--accent)'; bs.textContent='stamped ✓ locked'; bs.style.color='var(--accent)'; }
  else { bb.textContent=now; bb.style.color='var(--muted)'; bs.textContent='live clock — waiting'; bs.style.color='var(--muted)'; }
  if(wb){
    if(d.wake){ wb.textContent=d.wake; wb.style.color='var(--accent)'; ws.textContent='stamped ✓ locked'; ws.style.color='var(--accent)'; }
    else { wb.textContent=now; wb.style.color='var(--muted)'; ws.textContent='live clock — waiting'; ws.style.color='var(--muted)'; }
  }
}

    }

        +'<button class="wcorner wc-tr" data-wact="drag" data-i="'+id+'" title="Hold and drag to move">⠿</button>'
        +'<button class="wcorner wc-bl" data-wact="smaller" data-i="'+id+'" title="Smaller">－</button>'
        +'<button class="wcorner wc-br" data-wact="bigger" data-i="'+id+'" title="Bigger">＋</button>';
    }
    return '<div class="wcard sz-'+c.size+(edit?' editing':'')+'" data-wid="'+id+'"'+(st?' style="'+st+'"':'')+'>'
      +corners
      +'<div class="whead"><h2>'+ic(dd.ic)+' '+dd.t+'</h2>'+ctl+'</div>'+body+'</div>';
  }).join('');
  document.getElementById('tab-'+tab).innerHTML=html;
  if(edit){ document.querySelectorAll('#tab-'+tab+' .wc-tr').forEach(function(h){
    h.addEventListener('pointerdown',function(e){
      e.preventDefault();
      const card=h.closest('.wcard'); if(!card)return;
      const cont=card.parentElement;
      card.classList.add('dragging');
      try{ h.setPointerCapture(e.pointerId); }catch(err){}
      const move=function(ev){
        const cards=Array.prototype.slice.call(cont.querySelectorAll('.wcard')).filter(function(x){return x!==card;});
        let ref=null;
        for(let ci=0;ci<cards.length;ci++){ const r=cards[ci].getBoundingClientRect(); if(ev.clientY&&(ev.clientY<r.top+r.height/2)){ ref=cards[ci]; break; } }
        if(ref)cont.insertBefore(card,ref); else if(ev.clientY)cont.appendChild(card);
      };
      const up=function(){
        card.classList.remove('dragging');
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        const w4=wstate(tab);
        const ids=Array.prototype.slice.call(cont.querySelectorAll('.wcard')).map(function(x){return x.dataset.wid;});
        if(ids.length===w4.order.length){ w4.order=ids; }
        save(); renderAll();
      };
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up);
    });
  }); }
  document.querySelectorAll('#tab-'+tab+' [data-wact]').forEach(function(el){
    el.onclick=function(){
      const w2=wstate(tab), id=el.dataset.i, act=el.dataset.wact;
      if(!w2.cfg[id])w2.cfg[id]={size:'m',col:false,hide:false};
      if(act==='size'){ const o={s:'m',m:'l',l:'s'}; w2.cfg[id].size=o[w2.cfg[id].size]; }
      if(act==='smaller'){ w2.cfg[id].size={l:'m',m:'s',s:'s'}[w2.cfg[id].size]||'m'; }
      if(act==='bigger'){ w2.cfg[id].size={s:'m',m:'l',l:'l'}[w2.cfg[id].size]||'m'; }
      if(act==='col'){ w2.cfg[id].col=!w2.cfg[id].col; }
      if(act==='hide'){ w2.cfg[id].hide=!w2.cfg[id].hide; }
      if(act==='up'||act==='dn'){
        const i=w2.order.indexOf(id), j=act==='up'?i-1:i+1;
        if(j>=0&&j<w2.order.length){ const tmp=w2.order[i]; w2.order[i]=w2.order[j]; w2.order[j]=tmp; }
      }
      save(); renderAll();
    };
  });
  w.order.forEach(function(id){
    const c=w.cfg[id]||{size:'m',col:false,hide:false};
    if(c.col||c.hide)return;
    if(bodies[id]&&bodies[id].bind)try{ bodies[id].bind(); }catch(e){ if(window.reportErr)reportErr(e,'bind:'+id); }
  });
}

function itemStreak(id){
  let n=0, d=todayStr();
  if(!(S.done[d]||{})[id]) d=addDays(d,-1);
  while(S.done[d]&&S.done[d][id]){ n++; d=addDays(d,-1); }
  return n;
}
function bestStreak(){ let b=0; allItems().forEach(function(i){ b=Math.max(b,itemStreak(i.id)); }); return b; }
function dayCompletion(date){
  const items=allItems(); if(!items.length) return 0;
  const ds=S.done[date]||{}; let c=0;
  items.forEach(function(i){ if(ds[i.id])c++; });
  return c/items.length;
}

function eventsOn(dateStr){
  const list=[]; const d=new Date(dateStr+'T00:00:00');
  S.events2.forEach(function(e){
    if(e.recur==='yearly'){ if(e.date.slice(5)===dateStr.slice(5))list.push(e); return; }
    if(e.date===dateStr){ list.push(e); return; }
    if(!e.recur)return;
    const b=new Date(e.date+'T00:00:00'); if(d<b)return;
    if(e.recur==='weekly'&&d.getDay()===b.getDay())list.push(e);
    if(e.recur==='monthly'&&d.getDate()===b.getDate())list.push(e);
  });
  list.sort(function(a,b){var x=a.allDay?'':(a.start||'99'),y=b.allDay?'':(b.start||'99');return x<y?-1:x>y?1:0;});
  return list;
}

  return PALETTE[h%PALETTE.length]||'#94a3b8';

function incomeOn(month,dateStr){
  let sum=0;
  S.income.forEach(function(e){
    if(e.recur==='monthly'){ if(dateStr.slice(0,7)===month && e.date<=dateStr.replace(/-\d{2}$/,'-'+e.date.slice(8))) {} }
  });
  return sum;
}
function monthIncome(month){
  let sum=0;
  const [yy,mm]=month.split('-').map(Number);
  const lastDay=new Date(yy,mm,0).getDate();
  S.income.forEach(function(e){
    if(e.date.slice(0,7)===month)sum+=e.amount;
    else if(e.recur==='monthly'){
      const baseDay=parseInt(e.date.slice(8));
      const effDay=Math.min(baseDay,lastDay);
      const effDate=month+'-'+String(effDay).padStart(2,'0');
      if(e.date<=effDate)sum+=e.amount;
    }
  });

function tickSessions(){
  const clock=document.getElementById('scUtc'); if(!clock)return;
  const n=new Date();
  const p=function(x){return String(x).padStart(2,'0');};
  const uh=n.getUTCHours()+n.getUTCMinutes()/60+n.getUTCSeconds()/3600;
  clock.textContent=p(n.getUTCHours())+':'+p(n.getUTCMinutes())+':'+p(n.getUTCSeconds())+' UTC';
  const loc=document.getElementById('scLocal');
  if(loc)loc.textContent='Local '+p(n.getHours())+':'+p(n.getMinutes())+' - Asia/Manila';
  const nowMin=n.getUTCHours()*60+n.getUTCMinutes();
  let best=null,bestM=1e9;
  SCITIES.forEach(function(c){
    const open=sessOpen(c,uh);
    let m=((c.open*60-nowMin)%1440+1440)%1440;
    if(open)m+=1440;
    if(m<bestM){bestM=m;best=c;}
    const te=document.getElementById('scT-'+c.name); if(te)te.textContent=cityTime(c.tz);
    const bg=document.getElementById('scB-'+c.name); if(bg)bg.style.display=open?'':'none';
    const dt=document.getElementById('scD-'+c.name);
    if(dt){ dt.style.background=open?c.col:'var(--muted)'; dt.style.boxShadow=open?'0 0 9px '+c.col:'none'; }
    const mk=document.getElementById('mkm-'+c.name);
    if(mk){
      mk.setAttribute('opacity',open?'1':'.45');
      const ring=mk.querySelector('.mkring'); if(ring)ring.style.display=open?'':'none';
    }
  });
  const nx=document.getElementById('scNext');
  if(nx&&best)nx.textContent='Next: '+best.name+' in '+Math.floor(bestM/60)+'h '+(bestM%60)+'m';
  const sn=(12-uh)*15;
  ['termA','termB'].forEach(function(tid,k){
    const el=document.getElementById(tid); if(!el)return;
    const lon=sn+(k===0?-90:90);
    const x=(((lon+180)%360+360)%360)/360*640;
    let d='';
    [-640,0,640].forEach(function(off){
      const xx=x+off;
      d+='M '+xx+',2 Q '+(xx-18)+',85 '+xx+',170 Q '+(xx+18)+',255 '+xx+',338 ';
    });
    el.setAttribute('d',d);
  });
}
function tradeNet(){ return S.trades.reduce(function(s,t){return s+(t.result||0);},0); }
function equityPoints(){
  const pts=[S.startBal]; let b=S.startBal;
  const sorted=[...S.trades].sort(function(a,b2){return a.date.localeCompare(b2.date)||a.id.localeCompare(b2.id);});
  sorted.forEach(function(t){ b+=t.result||0; pts.push(b); });
  return pts;

function winstreaks(){
  const sorted=[...S.trades].sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id);});
  let tStreak=0; for(let i=0;i<sorted.length;i++){ if(sorted[i].result>0)tStreak++; else break; }
  const byDay={}; S.trades.forEach(function(t){ (byDay[t.date]=byDay[t.date]||[]).push(t); });
  let dStreak=0, d=todayStr();
  if(!byDay[d])d=addDays(d,-1);
  while(byDay[d]&&byDay[d].every(function(t){return t.result>0;})){ dStreak++; d=addDays(d,-1); }
  return {trades:tStreak,days:dStreak};
}

          const x=(P+i*step).toFixed(1), y=(H-P-((v-min)/rng)*(H-2*P)).toFixed(1);
          line+=(i?'L ':'M ')+x+' '+y; area+=(i?'L ':'M '+x+' '+(H-P)+' L ')+x+' '+y;
        });
        area+=' L '+(P+(pts.length-1)*step).toFixed(1)+' '+(H-P)+' Z';
        const up=pts[pts.length-1]>=S.startBal;
        eq='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:130px">'
          +'<defs><linearGradient id="gUp" x1="0" y1="0" x2="0" y2="1">'
          +'<stop offset="0%" stop-color="'+(up?'#4ade80':'#f87171')+'" stop-opacity=".4"/>'
          +'<stop offset="100%" stop-color="'+(up?'#4ade80':'#f87171')+'" stop-opacity="0"/></linearGradient></defs>'
          +'<path d="'+area+'" fill="url(#gUp)"/>'
          +'<path d="'+line+'" fill="none" stroke="'+(up?'#4ade80':'#f87171')+'" stroke-width="2.5"/></svg>'
          +'<div class="muted" style="font-size:11px">Equity curve · low '+fmtPeso(min)+' · high '+fmtPeso(max)+'</div>';
      }
      const wins=S.trades.filter(function(t){return t.result>0;});
      const wr=S.trades.length?Math.round(wins.length/S.trades.length*100):0;
      const bySym={};
      S.trades.forEach(function(t){ bySym[t.pair]=(bySym[t.pair]||0)+1; });
      const dData=Object.keys(bySym).map(function(k){return {label:k,value:bySym[k]};});
      return '<div class="section-title" style="margin-top:0">Balance</div>'+eq
        +'<div class="grid2" style="margin-top:12px"><div class="center"><div class="section-title" style="margin-top:0">Winrate</div>'+gaugeSvg(wr)+'</div>'
        +'<div><div class="section-title" style="margin-top:0">Symbols traded · '+S.trades.length+'</div>'
        +(dData.length?donutSvg(dData):'<div class="muted">No trades yet.</div>')+'</div></div>';
    }},
    tprofit:{ b:function(){
      const y=tCalCursor.getFullYear();
      const mData=[]; let maxAbs=1;
      for(let m=0;m<12;m++){
        const key=y+'-'+String(m+1).padStart(2,'0');
        let n=0,c=0;
        S.trades.forEach(function(t){ if(t.date.slice(0,7)===key){n+=t.result||0;c++;} });
        mData.push({m:m,net:n,cnt:c}); if(Math.abs(n)>maxAbs)maxAbs=Math.abs(n);
      }
      const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      let bars='<div class="section-title" style="margin-top:0">Monthly profit · '+y+'</div><div class="mbars">';
      mData.forEach(function(d){
        const h=Math.max(2,Math.round(Math.abs(d.net)/maxAbs*80));
        bars+='<div class="mbar" title="'+months[d.m]+': '+fmtPeso(d.net)+'"><i style="height:'+h+'px;background:'+(d.net>=0?'#4ade80':'#f87171')+'"></i><span>'+months[d.m]+'</span></div>';
      });
      bars+='</div>';
      let grid='<div class="section-title">Yearly performance</div><div class="ygrid">';
      mData.forEach(function(d){
        grid+='<div class="ycell"><div class="ym">'+months[d.m]+'</div>'
          +'<div class="yv '+(d.cnt===0?'muted':(d.net>=0?'pos':'neg'))+'">'+(d.cnt===0?'—':(d.net>0?'+':'')+fmtPeso(d.net))+'</div>'
          +'<div class="pcsmall">'+(d.cnt?d.cnt+' trades':'')+'</div></div>';
      });
      grid+='</div>';
      return bars+grid;
    }},
    tcal:{ b:function(){
      const y=tCalCursor.getFullYear(), m=tCalCursor.getMonth();
      const byDay={};
      S.trades.forEach(function(t){ (byDay[t.date]=byDay[t.date]||[]).push(t); });
      let mTr=0,mWin=0,mNet=0;
      Object.keys(byDay).forEach(function(d){
        if(d.slice(0,4)===String(y)&&parseInt(d.slice(5,7))===m+1){
          byDay[d].forEach(function(t){ mTr++; mNet+=t.result||0; if(t.result>0)mWin++; });
        }
      });
      const mPct=S.startBal?(mNet/S.startBal*100):0;
      let html='<div class="row" style="margin-top:0;margin-bottom:8px;align-items:center">'
        +'<button class="btn ghost small" id="tcPrev">‹</button>'
        +'<button class="btn ghost small" id="tcToday" style="flex:2">'+tCalCursor.toLocaleString('en',{month:'long',year:'numeric'})+'</button>'
        +'<button class="btn ghost small" id="tcNext">›</button></div>'
        +'<div class="grid4" style="margin-bottom:8px">'
        +stat(mTr,'Trades')+stat(mWin,'Wins')
        +stat('<span class="'+(mNet>=0?'pos':'neg')+'">'+(mNet>0?'+':'')+fmtPeso(mNet)+'</span>','Profits')
        +stat('<span class="'+(mPct>=0?'pos':'neg')+'">'+(mPct>=0?'+':'')+mPct.toFixed(2)+'%</span>','Percent')+'</div>';
      html+='<div class="pnl">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun','Total'].map(function(d){return '<div class="dow">'+d+'</div>';}).join('');
      const firstDow=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate();
      const cells=[];
      for(let i=0;i<firstDow;i++)cells.push(null);
      for(let d=1;d<=days;d++)cells.push(d);
      while(cells.length%7!==0)cells.push(null);
      for(let r=0;r<cells.length/7;r++){
        let wNet=0,wN=0;
        for(let c=0;c<7;c++){
          const d=cells[r*7+c];
          if(d===null){ html+='<div class="cell empty"></div>'; continue; }
          const ds=todayStr(new Date(y,m,d));
          const ts=byDay[ds]||[];
          const net=ts.reduce(function(s,t){return s+(t.result||0);},0);
          wNet+=net; wN+=ts.length;
          const pctv=S.startBal?(net/S.startBal*100):0;
          html+='<div class="cell'+(ts.length?(net>=0?' win':' loss'):'')+'">'+d
            +(ts.length?'<div class="pn '+(net>=0?'pos':'neg')+'">'+(net>0?'+':'')+fmtPeso(net)+'</div><div class="pn '+(net>=0?'pos':'neg')+'" style="font-weight:400">'+(pctv>=0?'+':'')+pctv.toFixed(2)+'% · '+ts.length+'t</div>':'')
            +'</div>';
        }
        html+='<div class="tcell">'+(wN?('<span class="'+(wNet>=0?'pos':'neg')+'">'+(wNet>0?'+':'')+fmtPeso(wNet)+'</span><span class="muted">'+wN+' trades</span>'):'<span class="muted">—</span>')+'</div>';
      }
      html+='</div>';
      return html;
    }, bind:function(){
      document.getElementById('tcPrev').onclick=function(){ tCalCursor.setMonth(tCalCursor.getMonth()-1); renderAll(); };
      document.getElementById('tcNext').onclick=function(){ tCalCursor.setMonth(tCalCursor.getMonth()+1); renderAll(); };
      document.getElementById('tcToday').onclick=function(){ tCalCursor=new Date(); tCalCursor.setDate(1); renderAll(); };
    }},
    tsym:{ b:function(){
      const rows={};
      S.trades.forEach(function(t){
        if(!rows[t.pair])rows[t.pair]={w:0,l:0,net:0};
        if(t.result>0)rows[t.pair].w++; else if(t.result<0)rows[t.pair].l++;
        rows[t.pair].net+=t.result||0;
      });
      const keys=Object.keys(rows);
      if(!keys.length)return '<div class="muted">Log trades to see per-pair stats.</div>';
      return '<table><tr><th>Symbol</th><th>Wins</th><th>Losses</th><th>Total</th><th>Winrate</th><th>Net</th></tr>'
        +keys.map(function(k){
          const r=rows[k], tot=r.w+r.l, wr=tot?Math.round(r.w/tot*100):0;
          return '<tr><td><b>'+esc(k)+'</b></td><td>'+r.w+'</td><td>'+r.l+'</td><td>'+tot+'</td>'
            +'<td class="'+(wr>=50?'pos':'neg')+'">'+wr+'%</td>'
            +'<td class="'+(r.net>=0?'pos':'neg')+'">'+(r.net>0?'+':'')+fmtPeso(r.net)+'</td></tr>';
        }).join('')+'</table>';
    }}
  };
}

function renderReview(days){
  const t=todayStr(), from=addDays(t,-(days-1));
  let habSum=0;
  for(let i=0;i<days;i++){ habSum+=dayCompletion(addDays(t,-i)); }
  const habPct=allItems().length?Math.round(habSum/days*100):0;
  let spent=0,earned=0;
  S.expenses.forEach(function(e){ if(e.date>=from&&e.date<=t)spent+=e.amount; });
  S.income.forEach(function(e){ if(e.date>=from&&e.date<=t)earned+=e.amount; });
  const tr=S.trades.filter(function(x){return x.date>=from&&x.date<=t;});
  const trW=tr.filter(function(x){return x.result>0;});
  const trNet=tr.reduce(function(s,x){return s+(x.result||0);},0);
  const trWr=tr.length?Math.round(trW.length/tr.length*100):0;
  const sl=S.sleep.filter(function(x){return x.date>=from&&x.date<=t;});
  const slAvg=sl.length?(sl.reduce(function(s,x){return s+x.hours;},0)/sl.length):0;
  let pomos=0; Object.keys(S.pomo).forEach(function(d){ if(d>=from&&d<=t)pomos+=S.pomo[d]; });
  let notesN=0; Object.keys(S.notes).forEach(function(d){ if(d>=from&&d<=t&&S.notes[d].text)notesN++; });
  const verdict=habPct>=80?'🔥 On fire. Keep the chain alive.':habPct>=50?'💪 Decent. Push past 80%.':habPct>0?'🌱 Started is everything — now repeat.':'🚪 The loop only breaks when you begin.';
  document.getElementById('reviewBox').innerHTML=
    '<div style="font-size:14px;margin-bottom:10px"><b>Last '+days+' days:</b> '+verdict+'</div>'
    +'<div class="grid4">'
    +stat(habPct+'%','Routine done')+stat(pomos,'Focus sessions')
    +stat(fmtPeso(earned),'Earned')+stat(fmtPeso(spent),'Spent')
    +stat(slAvg?slAvg.toFixed(1)+'h':'—','Avg sleep')+stat(notesN,'Journal notes')
    +stat(tr.length,'Trades')+stat(tr.length?trWr+'%':'—','Win rate')
    +'</div>'
    +tradeChart(tr)
    +(tr.length?'<div style="margin-top:10px;font-size:14px">Demo P&L: <b class="'+(trNet>=0?'pos':'neg')+'">'+(trNet>0?'+':'')+fmtPeso(trNet)+'</b></div>':'')
    +'<div class="muted" style="margin-top:10px;font-size:12px">'
    +(habPct<80?'Biggest lever: finish your morning routine daily. ':'')
    +(earned>0?(spent>earned?'⚠️ You spent more than you earned. ':'✅ You kept money this period — save the gap. '):'')
    +(tr.length&&trWr<50?'Trading: win rate under 50% — review the mistake bank before the next session.':'')+'</div>';
}

function dayChart(vals,maxv){
  var mx=(maxv||0);
  vals.forEach(function(x){ if(x.v>mx)mx=x.v; });
  mx=mx||1;
  var W=320,H=66,pad=6,base=H-16,top=5;
  var span=Math.max(1,vals.length-1);
  var pts=vals.map(function(x,i){ var px=pad+i*(W-2*pad)/span; var py=base-(x.v/mx)*(base-top); return [px.toFixed(1),Math.max(top,Math.min(base,py)).toFixed(1)]; });
  var d=pts.map(function(p,i){return (i?'L':'M')+p[0]+' '+p[1];}).join(' ');
  var area='';
  if(pts.length>1)area=d+' L'+pts[pts.length-1][0]+' '+base+' L'+pts[0][0]+' '+base+' Z';
  return '<svg class="daychart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    +'<defs><linearGradient id="dcGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity="0.30"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient></defs>'
    +(area?'<path d="'+area+'" fill="url(#dcGrad)"/>':'')
    +(pts.length>1?'<path d="'+d+'" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>':'')
    +pts.map(function(p,i){ return vals[i].v>0?'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.4" fill="#22c55e"/>':''; }).join('')
    +'</svg>'
    +'<div style="display:flex;justify-content:space-between;margin-top:2px">'+vals.map(function(x){return '<span class="muted" style="font-size:9.5px">'+esc(x.l)+'</span>';}).join('')+'</div>';
}

function mlineBuild(mo){
  var base=new Date(mo+'-01T00:00:00');
  var y=base.getFullYear(), mm=base.getMonth();
  var n=new Date(y,mm+1,0).getDate();
  var t=todayStr();
  var ci=[],ce=[],ai=0,ae=0;
  for(var d=1;d<=n;d++){
    var dss=y+'-'+('0'+(mm+1)).slice(-2)+'-'+('0'+d).slice(-2);
    var fi=0,fe=0;
    (S.income||[]).forEach(function(e){ if(e.date===dss)fi+=(+e.amount||0); });
    (S.expenses||[]).forEach(function(e){ if(e.date===dss)fe+=(+e.amount||0); });
    ai+=fi; ae+=fe;
    ci.push(ai); ce.push(ae);
    if(dss===t)break;
  }
  if(ci.length<2){ ci=[0,Math.max(ai,0.01)]; ce=[0,Math.max(ae,0.01)]; }
  var mx=Math.max(ai,ae,0.01,1);
  function pathFor(vals){
    var W=320,H=74,pad=5,bs=H-8,tp=4,span=Math.max(1,vals.length-1);
    var pts=vals.map(function(v,i){return [(pad+i*(W-2*pad)/span).toFixed(1),(bs-(v/mx)*(bs-tp)).toFixed(1)];});
    return {pts:pts,d:pts.map(function(p,i){return (i?'L':'M')+p[0]+' '+p[1];}).join(' ')};
  }
  var A=pathFor(ci), B=pathFor(ce);
  var la=A.pts[A.pts.length-1], lb=B.pts[B.pts.length-1];
  return '<svg class="daychart" style="height:86px" viewBox="0 0 320 74" preserveAspectRatio="none">'
    +'<path d="'+A.d+'" fill="none" stroke="#22c55e" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>'
    +'<path d="'+B.d+'" fill="none" stroke="#ef4444" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>'
    +'<circle cx="'+la[0]+'" cy="'+la[1]+'" r="3" fill="#22c55e"/>'
    +'<circle cx="'+lb[0]+'" cy="'+lb[1]+'" r="3" fill="#ef4444"/>'
    +'</svg>';
}

    const rd=new FileReader();
    rd.onload=function(){
      const img=new Image();
      img.onload=function(){
        const MAX=900, sc=Math.min(1,MAX/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        out[idx]=cv.toDataURL('image/jpeg',0.72);
        if(++done===files.length)cb(out.filter(Boolean));
      };
      img.onerror=function(){ if(++done===files.length)cb(out.filter(Boolean)); };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  });
  fileInput.value='';
}

function pManage(o,mode){
  var reopen=function(){ var b=window._lastPickBtn; setTimeout(function(){ if(b)window.pick(b); },10); };
  if(o.custom==='cat'){
    var cc=(S.customCats||[]).find(function(x){return x.id===o.v;}); if(!cc)return reopen();
    if(mode==='rename'){
      return uiAsk('Rename category',cc.label,function(nm){

        reopen();
      });
    }
    return uiConfirm('Remove category "'+cc.label+'"? Its events move to Personal.',function(){
      S.customCats=S.customCats.filter(function(x){return x.id!==o.v;});
      (S.events||[]).forEach(function(ev){ if(ev.cat===o.v)ev.cat='personal'; });
      save(); reopen();
    },{icon:'🗂️',okText:'Remove'});
  }
  var stdExp=o.custom==='exp_std', stdInc=o.custom==='inc_std';
  if(stdExp||stdInc){
    var kind=stdExp?'expense category':'earning source';
    if(mode==='rename'){
      return uiAsk('Rename "'+o.v+'" ('+kind+')','',function(nm){
        nm=(nm||'').trim();
        if(nm&&nm!==o.v){
          var pool=stdExp?allCats():['Work/Salary','Allowance','Side hustle','Gift'].concat(S.extraInc||[]);
          if(pool.indexOf(nm)>=0){ uiToast('That name already exists 🙂'); return reopen(); }
          if(stdExp){
            S.hiddenCats=(S.hiddenCats||[]).concat([o.v]);
            S.extraCats=(S.extraCats||[]).concat([nm]);
            (S.expenses||[]).forEach(function(x){ if(x.cat===o.v)x.cat=nm; });
            if(S.budgets&&S.budgets[o.v]!=null){ S.budgets[nm]=S.budgets[o.v]; delete S.budgets[o.v]; }
          }else{
            S.hiddenInc=(S.hiddenInc||[]).concat([o.v]);
            S.extraInc=(S.extraInc||[]).concat([nm]);
            (S.income||[]).forEach(function(x){ if(x.src===o.v)x.src=nm; });
          }
          save();
        }
        reopen();
      });
    }
    return uiConfirm('Remove "'+o.v+'" from this '+kind+' list? Past entries keep it as text — bring it back anytime with ＋ Add your own…',function(){
      if(stdExp){ S.hiddenCats=(S.hiddenCats||[]).concat([o.v]); }
      else{ S.hiddenInc=(S.hiddenInc||[]).concat([o.v]); }
      save(); reopen();
    },{icon:'🗂️',okText:'Remove'});
  }
  var key=o.custom==='inc'?'extraInc':'extraCats';
  var list=S[key]||[]; var idx=list.indexOf(o.v);
  if(idx<0)return reopen();
  if(mode==='rename'){
    return uiAsk('Rename "'+o.v+'"','',function(nm){
      nm=(nm||'').trim();
      if(nm&&nm!==o.v){
        list[idx]=nm;
        if(o.custom==='exp'){
          (S.expenses||[]).forEach(function(x){ if(x.cat===o.v)x.cat=nm; });
          if(S.budgets&&S.budgets[o.v]!=null){ S.budgets[nm]=S.budgets[o.v]; delete S.budgets[o.v]; }
        }else{
          (S.income||[]).forEach(function(x){ if(x.src===o.v)x.src=nm; });
        }
        save();
      }
      reopen();
    });
  }
  uiConfirm('Remove "'+o.v+'" from your list? Past entries keep it as text.',function(){
    list.splice(idx,1); save(); reopen();
  },{icon:'🗂️',okText:'Remove'});
}

<script>
// ============ LB2.8 CLOUD SYNC (GitHub private repo) ============
(function(){
'use strict';
var SK='loopbreaker_sync';
var cfg={on:false,owner:'',repo:'',path:'sync.json',token:'',dev:''};
var st={busy:false,remoteSha:null,remoteSavedAt:0,remoteDev:'',lastSync:0,pending:false,warned:false,pushT:null,intv:null,lastRemoteSig:null,lastPushSig:null};
var silent=false; // true while saving changes that CAME from the cloud (echo guard)
try{ var raw=localStorage.getItem(SK); if(raw){ var p=JSON.parse(raw); if(p&&typeof p==='object')cfg=Object.assign(cfg,p); } }catch(e){}
function saveCfg(){ try{ localStorage.setItem(SK,JSON.stringify(cfg)); }catch(e){} }
function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64d(s){ return decodeURIComponent(escape(atob(s.replace(/\n/g,'')))); }
function apiURL(){ return 'https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+encodeURIComponent(cfg.path||'sync.json'); }
function ready(){ return !!(cfg.on&&cfg.owner&&cfg.repo&&cfg.token); }
function toast(m){ try{ window.uiToast(m); }catch(e){} }

// ---- per-section change stamps (merged into S._kt, travels with the cloud copy) ----
var _snap={};
function stampSections(){
  if(!S||typeof S!=='object')return 0;
  if(!S._kt||typeof S._kt!=='object'||Array.isArray(S._kt))S._kt={};
  var now=Date.now(),n=0;
  for(var k in S){ if(k==='_kt')continue;
    if(typeof S[k]==='function')continue;
    var j; try{ j=JSON.stringify(S[k]); }catch(e){ continue; }
    if(_snap[k]!==undefined&&_snap[k]!==j){ S._kt[k]=now; n++; }
    _snap[k]=j;
  }
  return n;
}
// ---- wrap save(): stamp -> original save -> queue push only when something actually changed ----
if(typeof window.save==='function'&&!window.save.__lbSync){
  var _origSave=window.save;
  var patched=function(){ var n=stampSections(); _origSave(); if(ready()&&n>0&&!silent)queuePush(); };
  patched.__lbSync=true; try{ window.save=patched; }catch(e){}
}
// ---- wrap renderAll(): re-attach the sync card after each tab render ----
if(typeof window.renderAll==='function'&&!window.renderAll.__lbSync){
  var _origR=window.renderAll;
  var patchedR=function(){ _origR.apply(this,arguments); try{ card(); }catch(e){} };
  patchedR.__lbSync=true; try{ window.renderAll=patchedR; }catch(e){ window.addEventListener('load',card); }
}

// ---- GitHub API ----
function ghGet(){
  var go=function(){ return fetch(apiURL()+'?t='+Date.now(),{cache:'no-store',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'}}); };
  // flaky-wifi self-heal: up to 2 silent retries (2.5 s, then 6 s)
  return go().catch(function(){
    return new Promise(function(res,rej){
      setTimeout(function(){
        go().then(res,function(){
          setTimeout(function(){ go().then(res,rej); },6000);
        });
      },2500);
    });
  });
}
function ghPut(json,sha){
  return fetch(apiURL(),{method:'PUT',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify({message:'LB sync '+cfg.dev+' '+new Date().toISOString(),content:b64e(json),sha:sha||undefined})});
}
function blobFrom(json){
  var o=null; try{ o=JSON.parse(json); }catch(e){}
  if(o&&o.v===1&&o.data&&typeof o.data==='object')return o;
  return null;
}

// ---- MERGE: per-key newest stamp wins; arrays NEVER clobber (union, newest side first); unstamped ties: factory-default side loses ----
function sameId(a,b){
  if(a===b)return true;
  if(a&&b&&typeof a==='object'&&typeof b==='object'){ if(a.id!==undefined&&a.id===b.id)return true; return JSON.stringify(a)===JSON.stringify(b); }
  return false;
}
function unionArr(a,b){
  var out=[],seen={};
  function key(it){ return (it&&typeof it==='object'&&it.id!==undefined)?'id:'+it.id:((it&&typeof it==='object')?'j:'+JSON.stringify(it):'v:'+it); }
  function pushAll(arr){ (arr||[]).forEach(function(it){ var q=key(it); if(seen[q])return; seen[q]=1; out.push(it); }); }
  pushAll(a); pushAll(b); return out;
}
function unionNewFirst(newer,older){ return unionArr(newer,older); }
function unionObj(a,b){
  var o=JSON.parse(JSON.stringify(a||{}));
  Object.keys(b||{}).forEach(function(k){ if(!(k in o))o[k]=b[k];
    else if(o[k]&&b[k]&&typeof o[k]==='object'&&typeof b[k]==='object'&&!Array.isArray(o[k])&&!Array.isArray(b[k]))o[k]=unionObj(o[k],b[k]);
    else if(Array.isArray(o[k])&&Array.isArray(b[k]))o[k]=unionArr(o[k],b[k]); });
  return o;
}
function mergeRemote(blob,mode){ // mode: 'auto' | 'cloud' | 'device' | 'union'
  var rd=blob.data,kt={}; try{ kt=rd._kt&&typeof rd._kt==='object'?rd._kt:{}; }catch(e){ kt={}; }
  if(!S._kt||typeof S._kt!=='object')S._kt={};
  var DEF=(typeof def!=='undefined'&&def)?def:{};
  var taken=[],clash=[];
  Object.keys(rd).forEach(function(k){
    if(k==='_kt')return;
    var rv,lv; try{ rv=JSON.stringify(rd[k]); lv=JSON.stringify(S[k]); }catch(e){ return; }
    var rt=kt[k]||0,lt=S._kt[k]||0;
    if(rv===lv){ if(rt>lt)S._kt[k]=rt; return; }
    var decision;
    if(mode==='cloud')decision='remote';
    else if(mode==='device')decision='local';
    else if(mode==='union')decision='union';
    else if(rt>lt)decision='remote';
    else if(lt>rt)decision='local';
    else{ // unstamped tie: the side that still equals the factory default loses
      var ld=false,rdef=false;
      try{ ld=(lv===JSON.stringify(DEF[k])); rdef=(rv===JSON.stringify(DEF[k])); }catch(e){}
      if(ld&&!rdef)decision='remote';
      else if(rdef)decision='local';
      else decision='clash';
    }
    if(decision==='clash'){ clash.push(k); return; }
    var merged;
    try{
      if(Array.isArray(S[k])&&Array.isArray(rd[k])){ // arrays: never lose items — union, newest side first
        merged=(decision==='remote')?unionNewFirst(rd[k],S[k]):unionNewFirst(S[k],rd[k]);
      } else if(decision==='remote'){ merged=JSON.parse(rv); }
      else if(decision==='union'){
        if(S[k]&&rd[k]&&typeof S[k]==='object'&&typeof rd[k]==='object'&&!Array.isArray(S[k])&&!Array.isArray(rd[k]))merged=unionObj(S[k],rd[k]);
        else merged=S[k];
      }
      else merged=S[k];
    }catch(e){ merged=(decision==='remote')?JSON.parse(rv):S[k]; }
    var changed; try{ changed=(JSON.stringify(merged)!==lv); }catch(e){ changed=true; }
    S[k]=merged; S._kt[k]=Math.max(rt,lt)||blob.savedAt||Date.now();
    if(changed)taken.push(k);
  });
  if(mode!=='device'){ for(var k2 in kt){ if(S._kt[k2]===undefined)S._kt[k2]=kt[k2]; } }
  return {taken:taken,clash:clash};
}

// ---- conflict chooser (one-time overlay) ----
function chooser(blob,clash,then){
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px;';
  var when=blob.savedAt?new Date(blob.savedAt).toLocaleString():'';
  ov.innerHTML='<div style="background:var(--card,#141a24);border:1px solid var(--line,#2a3444);border-radius:16px;max-width:420px;width:100%;padding:18px;font-family:inherit">'+
   '<div style="font-size:17px;font-weight:700;margin-bottom:6px">☁️ Cloud data found</div>'+
   '<div style="font-size:13px;opacity:.85;line-height:1.5;margin-bottom:14px">This device and the cloud copy (from <b>'+(blob.dev||'another device')+'</b>, '+when+') both changed the same things and I can\'t tell which you want.<br>Pick what wins for THIS first sync:</div>'+
   '<button data-x="cloud" style="display:block;width:100%;margin:8px 0;padding:12px;border-radius:12px;border:1px solid var(--line,#2a3444);background:var(--card2,#1c2432);color:inherit;font-size:14px;font-weight:600">⬇️ Use cloud data (keep '+(blob.dev||'other')+'\'s version)</button>'+
   '<button data-x="device" style="display:block;width:100%;margin:8px 0;padding:12px;border-radius:12px;border:1px solid var(--line,#2a3444);background:var(--card2,#1c2432);color:inherit;font-size:14px;font-weight:600">📱 Keep this device\'s data</button>'+
   '<button data-x="union" style="display:block;width:100%;margin:8px 0;padding:12px;border-radius:12px;border:1px solid var(--line,#2a3444);background:var(--card2,#1c2432);color:inherit;font-size:14px;font-weight:600">🤝 Merge both (add together)</button>'+
   '<div style="font-size:11px;opacity:.6;margin-top:8px">Only asked once — afterwards every change syncs automatically. You can always Export a backup first (More → Backup).</div></div>';
  document.body.appendChild(ov);
  ov.querySelectorAll('button[data-x]').forEach(function(b){
    b.onclick=function(){ var m=b.dataset.x; ov.remove(); then(m); };
  });
}

// ---- PULL ----
function pullNow(cb){ // cb(ok, mergedCount, blob)
  if(!ready()||st.busy){ if(cb)cb(false,0,null); return; }
  st.busy=true;
  ghGet().then(function(r){
    if(r.status===404){ st.remoteSha=null; st.busy=false; if(cb)cb(true,0,null); return; }
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json().then(function(j){
      st.remoteSha=j.sha;
      var blob=blobFrom(b64d(j.content||''));
      if(!blob){ st.busy=false; if(cb)cb(true,0,null); return; }
      st.remoteSavedAt=blob.savedAt||0; st.remoteDev=blob.dev||'';
      if(blob.savedAt&&blob.savedAt<=lastSeenRemote()){ st.busy=false; if(cb)cb(true,0,blob); return; }
      if(blob.savedAt)markSeen(blob.savedAt);
      try{ st.lastRemoteSig=JSON.stringify(blob.data); }catch(e){}
      var res=mergeRemote(blob,'auto');
      var finish=function(){
        if(res.taken.length){ try{ window.save(); }catch(e){} try{ window.renderAll(); }catch(e){} }
        st.lastSync=Date.now(); saveCfg();
        if(res.taken.length)toast('🔄 Synced from '+(blob.dev||'another device')+' ('+res.taken.length+' update'+(res.taken.length>1?'s':'')+')');
        st.busy=false; if(cb)cb(true,res.taken.length,blob);
      };
      if(res.clash.length){ st.busy=false;
        chooser(blob,res.clash,function(m){
          st.busy=true;
          mergeRemote(blob,m);
          try{ window.save(); }catch(e){}
          try{ window.renderAll(); }catch(e){}
          st.lastSync=Date.now(); saveCfg(); st.busy=false; queuePush();
          if(cb)cb(true,res.clash.length,blob);
        });
      } else finish();
    });
  }).catch(function(e){ st.busy=false; st.lastErr=(e&&e.message)?e.message:'no connection'; warnOnce('⚠️ Sync check failed ('+st.lastErr+') — will retry'); if(cb)cb(false,0,null); });
}
var seenKey='lb_sync_seen';
function markSeen(t){ try{ localStorage.setItem(seenKey,String(t)); }catch(e){} }
function lastSeenRemote(){ try{ return Number(localStorage.getItem(seenKey))||0; }catch(e){ return 0; } }

// ---- PUSH ----
function pushNow(cb){
  if(!ready()||st.busy){ if(cb)cb(false); return; }
  st.busy=true; st.pending=true;
  var go=function(sha){
    var t=Date.now();
    var sig; try{ sig=JSON.stringify(S); }catch(e){ sig=null; }
    if(sig!==null&&(sig===st.lastRemoteSig||sig===st.lastPushSig)){ st.pending=false; st.lastSync=Date.now(); saveCfg(); st.busy=false; if(cb)cb(true); return; } // nothing new vs cloud — skip upload (kills echo churn)
    var payload={v:1,savedAt:t,dev:cfg.dev||'device',data:S};
    ghPut(JSON.stringify(payload),sha).then(function(r){
      if(r.status===409||r.status===422){ // sha moved -> pull-merge then retry once
        st.busy=false;
        return pullNow(function(ok){ if(ok)pushNow(cb); else { if(cb)cb(false); } });
      }
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json().then(function(j){ st.remoteSha=(j.content&&j.content.sha)||st.remoteSha; st.pending=false; st.lastSync=Date.now(); st.warned=false; st.lastPushSig=sig; markSeen(t); saveCfg(); try{card();}catch(e){} st.busy=false; if(cb)cb(true); });
    }).catch(function(e){ st.busy=false; st.lastErr=(e&&e.message)?e.message:'no connection'; warnOnce('⚠️ Sync upload failed ('+st.lastErr+') — will retry on next change'); try{card();}catch(e2){} if(cb)cb(false); });
  };
  if(st.remoteSha){ go(st.remoteSha); return; }
  ghGet().then(function(r){
    if(r.status===404)return go(undefined);
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json().then(function(j){ go(j.sha); });
  }).catch(function(e){ st.busy=false; st.lastErr=(e&&e.message)?e.message:'no connection'; warnOnce('⚠️ Sync upload failed ('+st.lastErr+')'); if(cb)cb(false); });
}
function warnOnce(m){ if(st.warned)return; st.warned=true; toast(m); }
function queuePush(){ clearTimeout(st.pushT); st.pushT=setTimeout(function(){ if(navigator.onLine)pushNow(); else queuePush(); },5000); }

// ---- auto pull loop ----
function startLoop(){
  if(st.intv)clearInterval(st.intv);
  st.intv=setInterval(function(){
    if(!ready()||st.busy)return;
    if(document.visibilityState==='visible'&&navigator.onLine)pullNow();
  },20000);
}
window.addEventListener('online',function(){ if(ready())pullNow(); });
document.addEventListener('visibilitychange',function(){ if(ready()&&!st.busy&&document.visibilityState==='visible'&&navigator.onLine)pullNow(); });

// ---- UI card (re-injected after every renderAll) ----
var draft={owner:cfg.owner||'',repo:cfg.repo||'loopbreaker-data',token:'',dev:cfg.dev||''};
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function fmtAgo(t){ if(!t)return 'never'; var d=Math.round((Date.now()-t)/1000); if(d<45)return 'just now'; if(d<3600)return Math.round(d/60)+' min ago'; if(d<86400)return Math.round(d/3600)+' h ago'; return new Date(t).toLocaleDateString(); }
function card(){
  var host=document.getElementById('tab-more'); if(!host)return;
  var old=document.getElementById('lbSyncCard'); if(old)old.remove();
  var el=document.createElement('div'); el.id='lbSyncCard';
  var inner;
  if(!ready()){
    inner='<div style="font-size:16px;font-weight:800;margin-bottom:4px">☁️ Cloud Sync</div>'+
    '<div style="font-size:12.5px;opacity:.75;line-height:1.5;margin-bottom:10px">Keep this app identical on <b>all your devices</b> — every change auto-saves to your own <b>private GitHub repo</b> and every device picks it up automatically.</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px">'+
    '<input id="lsO" placeholder="GitHub username (e.g. junixx98)" value="'+esc(draft.owner)+'" style="padding:10px 12px;border-radius:10px;border:1px solid var(--line,#2a3444);background:var(--card2,#1c2432);color:inherit;font-size:14px">'+
    '<input id="lsR" placeholder="Private repo name" value="'+esc(draft.repo)+'" style="padding:10px 12px;border-radius:10px;border:1px solid var(--line,#2a3444);background:var(--card2,#1c2432);color:inherit;font-size:14px">'+
    '<input id="lsT" type="password" placeholder="Paste token (github_pat_… / ghp_…)" value="'+esc(draft.token)+'" style="padding:10px 12px;border-radius:10px;border:1px solid var(--line,#2a3444);background:var(--card2,#1c2432);color:inherit;font-size:14px">'+
    '<input id="lsD" placeholder="This device\'s name (e.g. My Phone)" value="'+esc(draft.dev)+'" style="padding:10px 12px;border-radius:10px;border:1px solid var(--line,#2a3444);background:var(--card2,#1c2432);color:inherit;font-size:14px">'+
    '</div>'+
    '<button id="lsGo" style="width:100%;margin-top:10px;padding:12px;border-radius:12px;border:none;background:var(--accent,#38bdf8);color:#04121f;font-size:14px;font-weight:800">✅ Connect &amp; sync now</button>'+
    '<details style="margin-top:10px"><summary style="font-size:12.5px;opacity:.8;cursor:pointer">🪜 How to get a token (2 minutes, one time)</summary>'+
    '<ol style="font-size:12px;opacity:.8;line-height:1.7;margin:8px 0 0 18px;padding:0">'+
    '<li>On github.com: tap your avatar → <b>Settings</b> → bottom → <b>Developer settings</b>.</li>'+
    '<li><b>Personal access tokens</b> → <b>Fine-grained tokens</b> → <b>Generate new token</b>.</li>'+
    '<li>Token name: <b>loopbreaker</b> · Expiration: 90 or 365 days · <b>Repository access: Only select repositories</b> → pick your <b>loopbreaker-data</b> private repo (create it first: github.com/new → choose <b>Private</b>).</li>'+
    '<li>Under <b>Permissions → Repository permissions → Contents</b>: set to <b>Read and write</b>. Generate, then <b>copy the token</b> and paste it above.</li>'+
    '</ol></details>'+
    '<button id="lsProbe" style="width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1px solid var(--line,#2a3444);background:var(--card2,#1c2432);color:inherit;font-size:13px;font-weight:700">🧪 Test connection</button>'+
    '<div style="font-size:10.5px;opacity:.5;margin-top:8px">sync r6 · answers in ~3 s</div>';
  } else {
    inner='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:16px;font-weight:800">☁️ Cloud Sync</span><span style="font-size:10.5px;padding:2px 8px;border-radius:99px;background:#16a34a22;color:#4ade80;border:1px solid #4ade8055;font-weight:700">ON</span></div>'+
    '<div style="font-size:12.5px;opacity:.8;line-height:1.6">Syncing to <b>'+esc(cfg.owner+'/'+cfg.repo)+'</b> · this device: <b>'+esc(cfg.dev||'device')+'</b><br>'+
    'Last cloud change: <b>'+fmtAgo(st.remoteSavedAt)+'</b>'+(st.remoteDev?' (from '+esc(st.remoteDev)+')':'')+' · Last check: <b>'+fmtAgo(st.lastSync)+'</b>'+(st.pending?' · <b>⏳ changes waiting to upload…</b>':'')+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+
    '<button id="lsNow" style="flex:1;padding:11px;border-radius:12px;border:1px solid var(--line,#2a3444);background:var(--card2,#1c2432);color:inherit;font-size:13px;font-weight:700">🔄 Sync now</button>'+
    '<button id="lsOff" style="flex:1;padding:11px;border-radius:12px;border:1px solid #f8717155;background:#f8717118;color:#f87171;font-size:13px;font-weight:700">⏸ Disconnect</button>'+
    '</div><div style="font-size:11px;opacity:.55;margin-top:8px">Token is stored only on this device — it never gets uploaded. Cloud copy lives in your private repo.</div>';
  }
  el.innerHTML='<div class="wcard" style="margin-bottom:12px;padding:14px">'+inner+'</div>';
  host.insertBefore(el,host.firstChild);
  if(!ready()){
    ['lsO','lsR','lsT','lsD'].forEach(function(id){
      var n=document.getElementById(id); if(!n)return;
      n.oninput=function(){ draft[{lsO:'owner',lsR:'repo',lsT:'token',lsD:'dev'}[id]]=n.value; };
    });
    var g=document.getElementById('lsGo');
    if(g)g.onclick=function(){
      if(st.busy){ toast('⏳ Still working on the last attempt — wait 5 seconds'); return; }
      var o=(draft.owner||'').trim(),r=(draft.repo||'').trim(),t=(draft.token||'').trim(),d=(draft.dev||'').trim();
      if(!o||!r||!t){ toast('⚠️ Fill in username, repo name and token'); return; }
      cfg={on:true,owner:o,repo:r,path:'sync.json',token:t,dev:d||'device'};
      st.busy=false; st.lastErr=null; saveCfg();
      g.disabled=true; g.textContent='⏳ Connecting…';
      pullNow(function(ok,n2,blob){
        if(!ok&&!blob){
          // second opinion: run the exact probe sequence before declaring failure
          fetch('https://api.github.com/zen',{cache:'no-store'}).then(function(){
            return fetch(apiURL()+'?t='+Date.now(),{cache:'no-store',headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'}});
          }).then(function(r2){
            // connection alive AND repo reachable -> first failure was a flicker; retry the real pull once
            pullNow(function(ok3,n3,blob3){
              if(!ok3&&!blob3){ failConn('retry failed too — '+(st.lastErr||'unknown')); }
              else succeed(blob3);
            });
          }).catch(function(){
            failConn('no connection even to api.github.com — internet dropped');
          });
          function succeed(blob3){ card(); toast(blob3?'☁️ Connected — cloud copy found'+(st.remoteDev?' (from '+st.remoteDev+')':''):'☁️ Connected — your data is now saved to your private repo!'); }
          function failConn(why){
            toast('❌ '+why);
            var pl=document.getElementById('lsProbe'); if(pl)pl.textContent='🧪 LAST TRY FAILED: '+why+' — tap 🧪 Test connection; the moment it ends in OK, tap Connect immediately';
            g.disabled=false; g.textContent='✅ Connect & sync now'; cfg.on=false; saveCfg(); card();
          }
          return;
        }
        if(!blob){ pushNow(function(pok){ card(); toast(pok?'☁️ Connected — your data is now saved to your private repo!':'☁️ Connected (upload will retry automatically)'); }); }
        else { card(); toast('☁️ Connected — cloud copy found'+(st.remoteDev?' (from '+st.remoteDev+')':'')); }
      });
    };
    var pb=document.getElementById('lsProbe');
    if(pb)pb.onclick=function(){
      pb.textContent='⏳ Testing…'; pb.disabled=true;
      var out=[],t0=Date.now();
      var tok=(draft.token||'').trim()||'x';
      fetch('https://api.github.com/zen',{cache:'no-store'}).then(function(r){ return r.text(); }).then(function(tx){
        out.push('plain GitHub call OK ('+tx.length+' chars)');
        return fetch(apiURL()+'?t='+Date.now(),{cache:'no-store',headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'}});
      }).then(function(r){
        out.push('your-repo call: HTTP '+r.status+(r.status===404?' (empty vault — normal)':r.status===401?' (token wrong — but connection fine)':r.ok?' ✓':''));
        pb.textContent='🧪 '+out.join(' · '); pb.disabled=false;
      }).catch(function(e){
        out.push('FAILED: '+((e&&e.message)||'no connection')+' after '+Math.round((Date.now()-t0)/1000)+'s');
        pb.textContent='🧪 '+out.join(' · '); pb.disabled=false;
      });
    };
  } else {
    var n1=document.getElementById('lsNow'); if(n1)n1.onclick=function(){ n1.textContent='⏳…'; pullNow(function(){ pushNow(function(){ card(); }); }); };
    var n2=document.getElementById('lsOff'); if(n2)n2.onclick=function(){
      try{ window.uiConfirm('Disconnect cloud sync? Your data stays on this device — the cloud copy just stops updating.',function(){
        cfg.on=false; cfg.token=''; saveCfg(); clearInterval(st.intv); st.intv=null; card(); toast('☁️ Cloud sync disconnected');
      },{okText:'Disconnect'}); }catch(e){ cfg.on=false; saveCfg(); card(); }
    };
  }
}

// ---- boot ----
function boot(){
  card(); // card visible immediately (setup form when off, status when on)
  if(ready()){
    stampSections(); // baseline: don't stamp pre-existing data
    pullNow(function(){ startLoop(); });
  }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot); else boot();

// test hooks
window.LBSYNC={pullNow:pullNow,pushNow:pushNow,cfg:function(){return JSON.parse(JSON.stringify(cfg));},st:st,merge:mergeRemote};
})();
</script>
